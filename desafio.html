<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desafio Precep</title>
<meta name="description" content="Você sabe a resposta? Veja em segundos e conheça o Precep.">
<meta property="og:title" content="Desafio Precep: você sabe a resposta?">
<meta property="og:image" content="https://consultaia.github.io/precep/card-v2.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#F3F6F7;--surface:#fff;--surface2:#EAF0F2;--line:#D3DDE0;--fg:#0F1619;--muted:#55666C;--accent:#0E7C83;--on-accent:#fff;--ok:#0b6b4f;--okbg:#d7f0e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1619;--surface:#172126;--surface2:#1E2A30;--line:#2A3A40;--fg:#E8EEF0;--muted:#93A4AA;--accent:#6FD3D8;--on-accent:#062326;--ok:#8fe0c0;--okbg:#123a2f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;color:var(--fg);text-decoration:none}.logo i{color:var(--accent);font-style:normal}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--surface2);border-radius:999px;padding:5px 12px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:38px;line-height:1.05;margin:0 0 12px}
.caso{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:18px}
.op{display:grid;gap:8px;margin:14px 0}
.op button{font:inherit;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.op button:hover{border-color:var(--accent)}
.op button.certo{border-color:var(--ok);background:var(--okbg)}
.op button.errado{opacity:.55}
.resp{display:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:16px;margin-top:6px}
.resp.on{display:block}
.resp h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;margin:0 0 6px}
.resp p{margin:6px 0}
.cta{display:block;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;border-radius:14px;padding:15px;margin:18px 0 8px;font-size:18px}
.sec{display:block;text-align:center;color:var(--accent);font-weight:700;margin:6px 0}
.nota{color:var(--muted);font-size:14px}
.mais{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.mais a{border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;border-radius:999px;padding:8px 14px;font-size:15px}
</style>
</head>
<body>
<main>
  <div class="top"><a class="logo" href="conheca.html">Precep<i>.</i></a><span class="tag" id="num">Desafio</span></div>
  <h1 id="q"></h1>
  <div class="caso" id="caso"></div>
  <div class="op" id="op"></div>
  <div class="resp" id="resp"><h2 id="rt"></h2><div id="rx"></div>
    <p class="nota" id="ref"></p>
    <a class="cta" id="cta" href="./">Testar o Precep 5 dias grátis</a>
    <a class="sec" href="conheca.html">Ver tudo o que ele faz →</a>
  </div>
  <p class="nota" style="margin-top:18px">Conteúdo educativo. Confira sempre bula, diretriz e o protocolo do seu serviço.</p>
  <div class="mais" id="mais"></div>
</main>
<script>
var D={
 dose:{t:'Dose pediátrica',q:'Você calcula isso em 10 segundos?',caso:'Criança de <b>14 kg</b> com faringite estreptocócica. Amoxicilina <b>50 mg/kg/dia</b>, de 12/12h. Suspensão de <b>250 mg/5 ml</b>.<br><br><b>Quantos ml por dose?</b>',
  op:['3,5 ml','5 ml','7 ml','14 ml'],c:2,
  rt:'7 ml de 12/12h',rx:'<p>14 kg × 50 mg = <b>700 mg por dia</b>. Dividido em 2 tomadas: <b>350 mg por dose</b>.</p><p>Na suspensão de 250 mg/5 ml, 350 mg = <b>7 ml</b>. Por 10 dias.</p><p>No Precep você digita o peso e a receita sai pronta, com dose máxima e trava de idade conferidas.</p>',ref:'Base: diretrizes de faringoamigdalite estreptocócica (SBP/IDSA).'},
 glasgow:{t:'Escala de Glasgow',q:'Quanto dá esse Glasgow?',caso:'Paciente abre os olhos <b>só à pressão</b>, fala <b>palavras inapropriadas</b> e <b>localiza</b> o estímulo doloroso.',
  op:['8','9','10','11'],c:2,
  rt:'Glasgow 10 (O2 V3 M5)',rx:'<p>Abertura ocular à pressão: <b>2</b>. Palavras inapropriadas: <b>3</b>. Localiza a dor: <b>5</b>.</p><p>Total: <b>10</b>. No Precep, Glasgow, NIHSS e outros 20 scores vêm com o que fazer com o resultado.</p>',ref:'Base: Escala de Coma de Glasgow (revisão de 2014).'},
 gaso:{t:'Gasometria',q:'Essa acidose está compensada?',caso:'pH <b>7,28</b> · HCO₃ <b>12</b> mEq/L · PaCO₂ <b>26</b> mmHg.',
  op:['Sim, compensação respiratória adequada','Não, tem acidose respiratória associada','Não, tem alcalose respiratória associada','É alcalose metabólica'],c:0,
  rt:'Sim: compensada',rx:'<p>Acidose metabólica (pH e HCO₃ baixos). Pela fórmula de Winter, a PaCO₂ esperada é 1,5 × 12 + 8 = <b>26 ± 2</b>.</p><p>PaCO₂ de 26 está dentro do esperado: <b>compensação respiratória adequada</b>. O próximo passo é o anion gap.</p><p>No Precep você cola a gasometria e saem distúrbio, compensação, anion gap corrigido e delta-delta.</p>',ref:'Base: fórmula de Winter.'},
 dor:{t:'Anamnese',q:'Na frente do preceptor, você lembra de todos?',caso:'O paciente diz: "doutor, estou com dor". <b>Quais características da dor você precisa perguntar?</b>',
  op:['Só onde dói e há quanto tempo','Local, intensidade e o que melhora','Os 8 atributos da dor','Depende do paciente'],c:2,
  rt:'Os 8 atributos da dor',rx:'<p><b>1.</b> Localização · <b>2.</b> Início e duração · <b>3.</b> Caráter (aperto, queimação, pontada) · <b>4.</b> Intensidade (0 a 10) · <b>5.</b> Irradiação · <b>6.</b> Fatores de melhora e piora · <b>7.</b> Sintomas associados · <b>8.</b> Evolução e frequência.</p><p>No Precep a anamnese é de clicar: o roteiro inteiro aparece na tela e o texto se escreve sozinho.</p>',ref:'Base: semiologia médica.'}
};
var ordem=['dor','dose','glasgow','gaso'];
var u=new URLSearchParams(location.search),k=u.get('d');if(!D[k])k=ordem[0];var d=D[k];
document.title='Desafio Precep: '+d.t;
document.getElementById('num').textContent='Desafio · '+d.t;
document.getElementById('q').textContent=d.q;
document.getElementById('caso').innerHTML=d.caso;
document.getElementById('rt').textContent=d.rt;
document.getElementById('rx').innerHTML=d.rx;
document.getElementById('ref').textContent=d.ref;
var src=(u.get('utm_source')||'').replace(/[^a-z0-9_-]/gi,'').slice(0,30);
if(src)document.getElementById('cta').href='./?utm_source='+src+'&utm_campaign=desafio';
var op=document.getElementById('op');
d.op.forEach(function(t,i){var b=document.createElement('button');b.textContent=t;b.onclick=function(){[].forEach.call(op.children,function(x,j){x.disabled=true;x.className=j===d.c?'certo':(j===i?'errado':'')});
  var r=document.getElementById('resp');r.classList.add('on');document.getElementById('rt').textContent=(i===d.c?'Acertou! ':'Resposta: ')+d.rt;r.scrollIntoView({behavior:'smooth',block:'start'})};op.appendChild(b)});
var m=document.getElementById('mais');ordem.filter(function(x){return x!==k}).forEach(function(x){var a=document.createElement('a');a.href='?d='+x+(src?'&utm_source='+src:'');a.textContent='Outro desafio: '+D[x].t;m.appendChild(a)});
</script>
</body>
</html>
